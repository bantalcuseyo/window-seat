<!DOCTYPE html>

<script>

"use strict";
window.addEventListener("error",function(e){window.__err=(e.message||"err")+" @line "+e.lineno;});

/* ============================================================================
   WINDOW SEAT v2 — night-train memory game. Single file, no assets, no network.
   Steps: 1 backdrop · 2 strip · 3 nulls · 4 post-fx · 5 feel · 6 logic
   ========================================================================= */

const live=document.getElementById("al");

/* ---------- seeded rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(1907);
const shuffle=(arr)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  tube:"#d9ffe0",glow:"#7dffb0",amber:"#f5b872",amberDeep:"#e0803f",red:"#c43a3a",hot:"#ff5a5a",

/* ---------- traits ---------- */
const P={ears:["cat","tall-cat","spike","horn","round","tuft"],
  eyes:["narrow","round","x","smile","half","dot"],
  eyewear:["red-hp","grey-hp","visor","goggles","glasses","none"],
  top:["cream","maroon","hoodie","purple","sweater"],
  bottom:["jeans","grey","cargo"],
  shoes:["cream","beige","brown"],
  gadget:["red-handheld","clear-handheld","discman","walkman","paperback","pager","flip","cart","camera"],
  pose:["upright","slouch","cross","lean"]};
const GADGET_COLOR={"red-handheld":"#c43a3a","clear-handheld":"#9fd8ff","discman":"#c7d4e8",
  "walkman":"#f5b872","paperback":"#e8d6b0","pager":"#7dffb0","flip":"#b9a8ff","cart":"#ffd27d","camera":"#c9c9c9"};
const TOP_COLOR={cream:"#e8d6b0",maroon:"#6b2a2c",hoodie:"#2e5a45",purple:"#2a1f4a",sweater:"#6a6a72"};
const BOTTOM_COLOR={jeans:"#2a3f78",grey:"#4a4a52",cargo:"#22242a"};
const SHOE_COLOR={cream:"#d8c7aa",beige:"#c9b48f",brown:"#7a5230"};

/* ---------- content ---------- */
function N(o){return Object.assign({ears:"cat",eyes:"narrow",eyewear:"red-hp",top:"cream",bottom:"jeans",shoes:"cream",gadget:"red-handheld",pose:"upright"},o)}
const LINE=[
 {id:"start",title:"press start",speed:140,fog:3.5,q:["what"],frames:[
   {id:"a",at:.20,nulls:[N({top:"hoodie",gadget:"clear-handheld",eyes:"round",ears:"round",shoes:"beige"})],props:["bag"]},
   {id:"b",at:.62,nulls:[N({top:"maroon",gadget:"paperback",eyes:"half",ears:"horn",pose:"cross",shoes:"brown"})],props:[]}]},
 {id:"sleepover",title:"sleepover snack",speed:170,fog:3.0,q:["what","who"],frames:[
   {id:"a",at:.16,nulls:[N({top:"cream",gadget:"red-handheld",eyes:"smile",ears:"tuft"})],props:["chips"]},
   {id:"b",at:.50,nulls:[N({top:"purple",gadget:"walkman",eyes:"narrow",ears:"cat",pose:"slouch",shoes:"beige"})],props:["cola"]},
   {id:"c",at:.84,nulls:[N({top:"hoodie",gadget:"paperback",eyes:"dot",ears:"round",pose:"lean"})],props:["bag"]}]},
 {id:"arcade",title:"arcade closed",speed:190,fog:2.8,q:["who","count"],frames:[
   {id:"a",at:.14,nulls:[N({top:"maroon",gadget:"cart",eyes:"x",ears:"spike",pose:"lean"}),N({top:"cream",gadget:"pager",eyes:"round",ears:"round",pose:"slouch",shoes:"brown"})],props:["cabinet"]},
   {id:"b",at:.52,nulls:[N({top:"purple",gadget:"flip",eyes:"half",ears:"tall-cat"}),N({top:"sweater",gadget:"camera",eyes:"dot",ears:"cat",pose:"lean",shoes:"beige"})],props:["tokens"]},
   {id:"c",at:.88,nulls:[N({top:"hoodie",gadget:"paperback",eyes:"smile",ears:"tuft",pose:"cross"})],props:[]}]},
 {id:"school",title:"school flex",speed:210,fog:2.6,q:["what","absent"],frames:[
   {id:"a",at:.12,nulls:[N({top:"cream",gadget:"clear-handheld",eyes:"round",ears:"cat",pose:"cross"})],props:["pens"]},
   {id:"b",at:.38,nulls:[N({top:"maroon",gadget:"paperback",eyes:"half",ears:"horn",shoes:"brown"}),N({top:"hoodie",gadget:"discman",eyes:"narrow",ears:"tuft",pose:"slouch"})],props:["keychain"]},
   {id:"c",at:.66,nulls:[N({top:"purple",gadget:"red-handheld",eyes:"smile",ears:"round",pose:"lean"})],props:["stickers"]},
   {id:"d",at:.90,nulls:[N({top:"sweater",gadget:"pager",eyes:"dot",ears:"tall-cat",pose:"slouch",shoes:"beige"})],props:[]}]},
 {id:"rainy",title:"rainy saturday",speed:220,fog:2.4,weather:"rain",q:["who","count"],frames:[
   {id:"a",at:.12,nulls:[N({top:"hoodie",gadget:"walkman",eyes:"smile",ears:"cat"}),N({top:"cream",gadget:"paperback",eyes:"half",ears:"round",pose:"slouch",shoes:"brown"})],props:["umbrella"]},
   {id:"b",at:.42,nulls:[N({top:"maroon",gadget:"clear-handheld",eyes:"round",ears:"horn",pose:"lean"})],props:["puddle"]},
   {id:"c",at:.70,nulls:[N({top:"purple",gadget:"red-handheld",eyes:"narrow",ears:"spike",pose:"lean"}),N({top:"sweater",gadget:"pager",eyes:"dot",ears:"tuft",pose:"slouch"})],props:["umbrella"]},
   {id:"d",at:.92,nulls:[N({top:"hoodie",gadget:"camera",eyes:"x",ears:"round",pose:"cross",shoes:"beige"})],props:[]}]},
 {id:"five",title:"five more minutes",speed:240,fog:2.2,q:["absent","who"],frames:[
   {id:"a",at:.12,nulls:[N({top:"cream",gadget:"paperback",eyes:"half",ears:"round",pose:"lean"})],props:["blanket"]},
   {id:"b",at:.38,nulls:[N({top:"purple",gadget:"discman",eyes:"narrow",ears:"cat",pose:"slouch",shoes:"brown"}),N({top:"hoodie",gadget:"flip",eyes:"dot",ears:"tuft"})],props:["nightlight"]},
   {id:"c",at:.62,nulls:[N({top:"maroon",gadget:"walkman",eyes:"smile",ears:"horn",pose:"cross"})],props:["blanket"]},
   {id:"d",at:.84,nulls:[N({top:"sweater",gadget:"red-handheld",eyes:"x",ears:"spike",pose:"slouch",shoes:"beige"}),N({top:"cream",gadget:"pager",eyes:"round",ears:"round",pose:"slouch"})],props:["nightlight"]},
   {id:"e",at:.96,nulls:[N({top:"hoodie",gadget:"paperback",eyes:"half",ears:"cat",pose:"lean"})],props:[]}]},
 {id:"last",title:"last train",speed:260,fog:2.0,q:["any","similar"],frames:[
   {id:"a",at:.12,nulls:[N({top:"cream",gadget:"paperback",eyes:"narrow",ears:"round",pose:"slouch"})],props:["vending"]},
   {id:"b",at:.34,nulls:[N({top:"maroon",gadget:"discman",eyes:"half",ears:"horn",shoes:"brown"}),N({top:"purple",gadget:"red-handheld",eyes:"dot",ears:"cat",pose:"lean"}),N({top:"sweater",gadget:"camera",eyes:"round",ears:"tuft",pose:"slouch"})],props:[]},
   {id:"c",at:.60,nulls:[N({top:"hoodie",gadget:"flip",eyes:"x",ears:"spike",pose:"cross",shoes:"beige"}),N({top:"cream",gadget:"walkman",eyes:"smile",ears:"round",pose:"upright"})],props:["vending"]},
   {id:"d",at:.82,nulls:[N({top:"purple",gadget:"paperback",eyes:"half",ears:"tall-cat",pose:"lean"})],props:[]},
   {id:"e",at:.95,nulls:[N({top:"maroon",gadget:"pager",eyes:"dot",ears:"cat",pose:"slouch",shoes:"brown"})],props:[]}]}
];

/* ---------- step 2: continuous strip ---------- */
const SEG=620, PAD=300;
function stripOf(stop){
  if(stop._strip)return stop._strip;
  const L=Math.round(Math.max(...stop.frames.map(f=>f.at))*SEG+PAD);
  const strip={len:L,items:[]};
  stop.frames.forEach((f,i)=>{
    strip.items.push({x:Math.round(f.at*L),frame:f,idx:i});
  });
  stop._strip=strip;return strip;
}
function watchSeconds(stop){
  const s=stripOf(stop);
  return Math.max(12,Math.min(30,(s.len+W)/stop.speed));
}

/* ---------- audio ---------- */
const AU={ctx:null,on:false,master:null,music:null,sfx:null,started:false};
function auInit(){if(AU.ctx)return;try{
  AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
  AU.master=AU.ctx.createGain();AU.master.gain.value=.5;AU.master.connect(AU.ctx.destination);
  AU.music=AU.ctx.createGain();AU.music.gain.value=.14;AU.music.connect(AU.master);
  AU.sfx=AU.ctx.createGain();AU.sfx.gain.value=.45;AU.sfx.connect(AU.master);
  AU.on=true;bedStart();}catch(e){}}
function noiseBuf(sec){const n=AU.ctx.sampleRate*sec,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);
  let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}return b}
function bedStart(){if(!AU.on||AU.started)return;AU.started=true;
  const src=AU.ctx.createBufferSource();src.buffer=noiseBuf(3);src.loop=true;
  const lp=AU.ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=140;
  const g=AU.ctx.createGain();g.gain.value=.22;src.connect(lp).connect(g).connect(AU.music);src.start();}
function blip(freq=880,dur=.04,type="square",gain=.25,when=0){if(!AU.on)return;
  const t=AU.ctx.currentTime+when,o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AU.sfx);o.start(t);o.stop(t+dur+.02);}
const sfxCorrect=()=>{blip(660,.12,"triangle",.3);blip(990,.18,"triangle",.22,.11);blip(1320,.3,"sine",.12,.22)};
const sfxWrong=()=>{blip(140,.28,"sawtooth",.28);blip(90,.4,"sine",.2,.06)};
const sfxMenu=()=>{blip(880,.04,"square",.18);blip(1320,.05,"square",.12,.03)};
const sfxPunch=()=>{blip(180,.05,"square",.3);blip(60,.18,"sawtooth",.22,.04)};
const sfxTick=()=>{blip(1560,.03,"square",.12)};
const sfxSpark=()=>{blip(1760,.09,"triangle",.16);blip(2340,.12,"sine",.1,.05)};

/* ---------- state ---------- */
const S={mode:"title",stop:0,lamps:3,results:[],sparks:0,name:"",seen:{},wipeHoles:[],
  trauma:0,hitStop:0,flash:0,answered:0,correct:0,lightsOut:false,qs:[],qi:0,q:null,typed:"",typing:false,
  optSel:-1,locked:false,scroll:0,stopPhase:"",phaseT:0,bestFrame:null,ghost:null,secrets:{},uncovered:{},
  settings:false,stack:["title"],resume:null,wave:0};

/* ---------- safe area (game-ui-ux §4) ---------- */
let SAFE={t:0,r:0,b:0,l:0};
function readSafe(){
  const el=document.getElementById("safe");
  if(!el)return;
  const cs=getComputedStyle(el);
  SAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,
        b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
/* ---------- sizing ---------- */
let gl=null,glProg=null,glTex=null,glSig=null;
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const sw=innerWidth,sh=innerHeight,scale=Math.min(sw/W,sh/H);
  glc.width=Math.round(W*dpr);glc.height=Math.round(H*dpr);
  glc.style.width=(W*scale)+"px";glc.style.height=(H*scale)+"px";
  document.getElementById("shell").className=(cfg.shell&&sw>=900)?"on":"";
  if(gl){gl.viewport(0,0,glc.width,glc.height)}
  readSafe();buildFog();
}
addEventListener("resize",resize);

/* ---------- step 1: lit backdrop helpers ---------- */
function drawFarTrain(scroll,t){
  const xoff=-((scroll*0.35)%900);
  for(let i=-1;i<3;i++){
    const bx=i*900+xoff, y=300, h=210;
    // body
    ctx.fillStyle="#2a2036";rr(ctx,bx,y,860,h,26);ctx.fill();
    // windows: smeared amber streaks
    for(let w=0;w<7;w++){
      const wx=bx+40+w*116, wy=y+44;
      const g=ctx.createLinearGradient(wx,0,wx+96,0);
      g.addColorStop(0,"#ffcf8f");g.addColorStop(.45,"#ffe0ae");g.addColorStop(1,"#f5a95c");
      ctx.fillStyle=g;rr(ctx,wx,wy,96,72,8);ctx.fill();
      // smear
      ctx.fillStyle="rgba(255,225,180,.45)";
      for(let s=0;s<5;s++)ctx.fillRect(wx+6,wy+10+s*13,84,4);
      ctx.fillStyle="rgba(255,240,210,.25)";ctx.fillRect(wx+8,wy+8,80,4);
    }
    // roof light strip
    ctx.fillStyle="rgba(245,184,114,.20)";ctx.fillRect(bx+10,y+8,840,4);
  }
}
function drawBackWall(scroll,t){
  const xoff=-((scroll*0.5)%520);
  for(let i=-1;i<4;i++){
    const bx=i*520+xoff;
    // solid pale green wall, brighter at the top, dimmer at the floor line
    const g=ctx.createLinearGradient(0,360,0,660);
    g.addColorStop(0,"#a9e8c8");g.addColorStop(.55,"#86cfa9");g.addColorStop(1,"#4f8f76");
    ctx.fillStyle=g;ctx.fillRect(bx,360,520,300);
    // tube wash on the wall
    ctx.fillStyle="rgba(255,255,255,.20)";ctx.fillRect(bx,360,520,30);
    ctx.fillStyle="rgba(0,0,0,.18)";ctx.fillRect(bx,636,520,34);
    // posters + vending glow sit ON the wall
    ctx.fillStyle="rgba(20,12,30,.55)";ctx.fillRect(bx+60,430,74,98);ctx.fillRect(bx+300,442,66,84);
    ctx.fillStyle="rgba(245,184,114,.85)";ctx.fillRect(bx+182,424,88,110);
    ctx.fillStyle="rgba(255,240,210,.55)";ctx.fillRect(bx+190,438,72,44);
    ctx.fillStyle="rgba(20,12,30,.35)";ctx.fillRect(bx+182,530,88,4);
  }
}

/* ---------- step 3: path-based null ---------- */
function ell(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,rx,ry,rot,0,6.283);c.fill()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function drawNull(c,tr,x,y,s,t,opt={}){
  /* y = ground line (feet). Total height ≈ 280*s before scale */
  const H0=240, headH=H0*0.38, bodyH=H0-headH;
  const ph=(opt.ph||0), pose=tr.pose, breathe=Math.sin(t*1.7+ph)*1.4;
  const awake=!!opt.awake, wave=!!opt.wave;
  c.save();c.translate(x,y);c.scale(s,s);
  const hip=-bodyH*0.42, chest=-bodyH*0.92, headY=-(bodyH+headH*0.55);

  /* ---- legs + sneakers (pose changes stance) ---- */
  const stance={upright:0,slouch:6,cross:14,lean:-8}[pose]||0;
  const legTop=hip, legBot=-18;
  if(opt.sit){
    // seated: thigh forward, shin down
    const kneeY=legTop+26;
    c.fillStyle=BOTTOM_COLOR[tr.bottom]||C.jeans;
    c.beginPath();c.moveTo(-30,legTop-8);c.lineTo(6,legTop-8);c.lineTo(18,kneeY);c.lineTo(-26,kneeY+6);c.closePath();c.fill();
    c.beginPath();c.moveTo(-26,kneeY+6);c.lineTo(6,kneeY+4);c.lineTo(2,kneeY+48);c.lineTo(-24,kneeY+48);c.closePath();c.fill();
    drawShoe(c,-12,kneeY+56,tr.shoes,0);
    drawShoe(c, 40,legBot,tr.shoes,1);
  } else {
    drawShoe(c,-30+stance*0.3,legBot,tr.shoes,0);
    drawShoe(c, 34-stance*0.2,legBot,tr.shoes,1);
  }
  // pant tubes (wide, tapered, with crease)
  const pc=BOTTOM_COLOR[tr.bottom]||C.jeans;
  if(!opt.sit){
    pant(c,-34+stance*0.3,legTop,-30+stance*0.3,legBot+10,30,pc,pose==="cross");
    pant(c, 28-stance*0.2,legTop, 36-stance*0.2,legBot+10,30,pc,false);
  }
  if(pose==="cross"){
    // crossed shin over the other leg
    c.save();c.strokeStyle=pc;c.lineWidth=26;c.lineCap="round";
    c.beginPath();c.moveTo(-16,legTop+34);c.quadraticCurveTo(24,legBot-18,44,legBot+4);c.stroke();c.restore();
  }

  /* ---- torso: baggy trapezoid with folds ---- */
  const tilt=(pose==="lean")?-6:(pose==="slouch")?-2:0;
  c.save();c.rotate(tilt*Math.PI/180);
  const topC=TOP_COLOR[tr.top]||C.cream;
  const hw=44, bw=58;
  c.fillStyle=topC;
  c.beginPath();
  c.moveTo(-hw,chest+breathe);c.lineTo(hw,chest+breathe);
  c.quadraticCurveTo(bw+6,hip-18,bw,hip);
  c.lineTo(-bw,hip);c.quadraticCurveTo(-bw-6,hip-18,-hw,chest+breathe);
  c.closePath();c.fill();
  // fabric folds
  c.strokeStyle="rgba(0,0,0,.22)";c.lineWidth=2;
  c.beginPath();c.moveTo(-26,chest+18);c.quadraticCurveTo(-18,hip-26,-26,hip-4);c.stroke();
  c.beginPath();c.moveTo(22,chest+20);c.quadraticCurveTo(30,hip-22,20,hip-2);c.stroke();
  c.beginPath();c.moveTo(-4,chest+26);c.lineTo(-2,hip-6);c.stroke();
  if(tr.top==="purple"){c.fillStyle="rgba(255,255,255,.14)";c.fillRect(-3,chest+6,6,bodyH*0.5)}
  if(tr.top==="hoodie"){c.fillStyle="rgba(0,0,0,.20)";rr(c,-26,chest+6,52,26,12);c.fill()}
  c.restore();

  /* ---- arms (pose dependent) ---- */
  const armY=chest+16;
  c.strokeStyle=topC;c.lineWidth=17;c.lineCap="round";
  if(wave){ // secret: hand up, waving
    c.beginPath();c.moveTo(hw-6,armY);c.quadraticCurveTo(hw+30,armY-30,hw+16,armY-72);c.stroke();
    c.fillStyle=C.null;ell(c,hw+16,armY-80,10,10);
    c.save();c.translate(hw+16,armY-80);c.rotate(Math.sin(t*9)*0.4);
    c.strokeStyle=C.null;c.lineWidth=8;c.beginPath();c.moveTo(0,0);c.lineTo(0,-14);c.stroke();c.restore();
    c.beginPath();c.moveTo(-hw+6,armY);c.quadraticCurveTo(-hw-16,armY+26,-10,hip-16);c.stroke();
  } else if(pose==="slouch"){
    c.beginPath();c.moveTo(-hw+6,armY);c.quadraticCurveTo(-hw-26,armY-6,-hw-40,armY-26);c.stroke();
    c.beginPath();c.moveTo(hw-6,armY);c.quadraticCurveTo(hw+18,armY+30,6,hip-14);c.stroke();
    c.fillStyle=C.null;ell(c,hw+22,armY+34,10,9);
  } else if(pose==="cross"){
    c.beginPath();c.moveTo(-hw+6,armY);c.quadraticCurveTo(-hw-10,armY+34,4,hip-10);c.stroke();
    c.beginPath();c.moveTo(hw-6,armY);c.quadraticCurveTo(hw+12,armY+30,-6,hip-6);c.stroke();
  } else {
    c.beginPath();c.moveTo(-hw+6,armY);c.quadraticCurveTo(-hw-12,armY+28,-14,hip-14);c.stroke();
    c.beginPath();c.moveTo(hw-6,armY);c.quadraticCurveTo(hw+12,armY+28,14,hip-14);c.stroke();
  }

  /* ---- gadget + glow cast ---- */
  const gy=hip-30, gx=(pose==="lean")?6:0;
  const gcol=GADGET_COLOR[tr.gadget]||"#c43a3a";
  if(tr.gadget!=="paperback"){

  }
  // droplet streaks
  for(let i=0;i<70;i++){
    const x=Math.random()*fog.width,y=Math.random()*fog.height*.8,w=1+Math.random()*2.4,h=10+Math.random()*70;

function wipeAt(x,y,dx,dy){
  fx.globalCompositeOperation="destination-out";
  const steps=Math.max(1,Math.floor(Math.hypot(dx,dy)/7));
  for(let i=1;i<=steps;i++){
    const px=x-dx+dx*i/steps, py=y-dy+dy*i/steps;
    const g=fx.createRadialGradient(px,py,0,px,py,FOG_R);
    g.addColorStop(0,"rgba(0,0,0,1)");g.addColorStop(.6,"rgba(0,0,0,.95)");g.addColorStop(1,"rgba(0,0,0,0)");
    fx.fillStyle=g;fx.beginPath();fx.arc(px,py,FOG_R,0,6.283);fx.fill();
  }
  fx.globalCompositeOperation="source-over";
}

/* ---------- step 4: post-fx ---------- */
const FX={ready:false,prog:null,tex:null,cv:null,loc:{}};
const VS="$vertex";
let glCanvas=null, dispCtx=null;
function initGL(){
  try{
    glCanvas=document.createElement("canvas");
    glCanvas.width=960;glCanvas.height=1200;
    const g=glCanvas.getContext("webgl2",{alpha:false,antialias:false});
    dispCtx=glc.getContext("2d");
    if(!g)return false;
    const vs=`#version 300 es
    in vec2 p; out vec2 uv; void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.,1.);}`;
    const fs=`#version 300 es
    precision highp float;
    in vec2 uv; out vec4 o;
    uniform sampler2D tex; uniform float sig; uniform float t; uniform vec2 res;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      vec2 d=uv-0.5;
      float barrel=0.03;
      vec2 cuv=uv+d*dot(d,d)*barrel;
      float ca=(0.6+1.6*(1.0-sig))/res.x;
      float r=texture(tex,cuv+vec2(ca,0.)).r;
      float gg=texture(tex,cuv).g;
      float b=texture(tex,cuv-vec2(ca,0.)).b;
      vec3 col=vec3(r,gg,b);
      // bloom: cheap 5-tap on bright
      vec3 bl=vec3(0.);
      for(int i=0;i<5;i++){
        vec2 off=vec2(cos(float(i)*1.2566),sin(float(i)*1.2566))*3.0/res;
        vec3 s=texture(tex,cuv+off).rgb;
        bl+=max(s-0.72,0.0);
      }
      col+=bl*0.35*(0.55+0.45*sig);
      // grade: teal shadows, amber highlights
      col=mix(col,vec3(col.r*1.04,col.g*0.99,col.b*1.02),1.0);
      col=mix(col,vec3(0.55,0.85,0.78)*dot(col,vec3(.33)),(1.0-sig)*0.12);
      // scanlines
      float sl=step(0.5,fract(gl_FragCoord.y*0.5));
      col*=mix(1.0,0.94+0.06*sl,0.8);
      // grain
      col+=(hash(uv*res+t)-0.5)*0.055;
      // vignette
      float v=1.0-dot(d,d)*(0.55+0.7*(1.0-sig));
      col*=clamp(v,0.,1.);
      o=vec4(col,1.);
    }`;

/* ---------- questions (step 6) ---------- */
const labelGadget=(g)=>({"red-handheld":"red handheld","clear-handheld":"clear handheld",discman:"discman",walkman:"walkman tape",paperback:"paperback",pager:"pager",flip:"flip phone",cart:"game cartridge",camera:"disposable camera"})[g]||g;
const labelTop=(t)=>({cream:"cream tee",maroon:"maroon jacket",hoodie:"green hoodie",purple:"purple track jacket",sweater:"grey sweater"})[t]||t;
const labelNull=(tr)=>labelTop(tr.top)+" + "+labelGadget(tr.gadget);

function seenNulls(stop){
  const out=[];
  Object.keys(S.seen).forEach(k=>{
    if(!k.startsWith(stop.id+":"))return;
    if((S.seen[k]||0)<1.0)return;
    const [,fid,idx]=k.split(":");
    const fr=stop.frames.find(f=>f.id===fid); if(!fr)return;
    const tr=fr.nulls[+idx]; if(tr)out.push(tr);
  });
  return out;
}
function allNullsOf(stop){const a=[];stop.frames.forEach(f=>f.nulls.forEach(n=>a.push(n)));return a}
function makeQuestion(stop){
  const seen=seenNulls(stop);
  const pool=seen.length?seen:allNullsOf(stop);
  const types=stop.q.slice();
  let type=types[Math.floor(rnd()*types.length)];
  if(type==="any"||type==="similar")type=pool.length>1?"who":"what";
  if(type==="count"&&seen.length<1)type="what";
  if(type==="who"&&pool.length<2)type="what";
  if(type==="absent")type="absent";
  if(type==="count"){
    const n=allNullsOf(stop).length;                    // step 6: whole stop
    const opts=[...new Set([n,Math.max(1,n-1),n+1,Math.min(6,n+2)])].slice(0,4);
    while(opts.length<4){const v=1+Math.floor(rnd()*6);if(!opts.includes(v))opts.push(v)}
    return {type,prompt:"how many nulls were waiting on this platform?",options:shuffle(opts).map(v=>({label:v+" nulls",ok:v===n}))};
  }
  if(type==="who"){
    // `puzzle` skill: exactly one correct option and no duplicate labels — dedupe by LABEL, not identity
    const target=pool[Math.floor(rnd()*pool.length)];
    const seenLabels=new Set([labelNull(target)]);
    const opts=[{tr:target,ok:true}];
    shuffle(allNullsOf(stop).filter(o=>o!==target)).forEach(o=>{
      if(opts.length>=4)return;
      const l=labelNull(o);
      if(seenLabels.has(l))return;
      seenLabels.add(l);opts.push({tr:o,ok:false});
    });
    let guard=0;
    while(opts.length<4&&guard++<80){
      const cand=N({top:P.top[Math.floor(rnd()*5)],gadget:P.gadget[Math.floor(rnd()*9)],ears:P.ears[Math.floor(rnd()*6)]});
      const l=labelNull(cand);
      if(seenLabels.has(l))continue;
      seenLabels.add(l);opts.push({tr:cand,ok:false});
    }
    return {type,prompt:"who was holding the "+labelGadget(target.gadget)+"?",options:shuffle(opts).map(o=>({label:labelNull(o.tr),ok:o.ok,tr:o.tr}))};
  }
  if(type==="absent"){
    const gadgets=[...new Set(allNullsOf(stop).map(n=>n.gadget))];
    const missing=P.gadget.find(g=>!gadgets.includes(g))||"pager";
    const opts=[{v:missing,ok:true},...shuffle(gadgets).slice(0,3).map(g=>({v:g,ok:false}))];
    return {type,prompt:"which one was NOT on the platform?",options:shuffle(opts).map(o=>({label:labelGadget(o.v),ok:o.ok}))};
  }
  const target=pool[Math.floor(rnd()*pool.length)];
  const opts=[{v:target.gadget,ok:true}];
  shuffle(P.gadget.filter(g=>g!==target.gadget)).slice(0,3).forEach(g=>opts.push({v:g,ok:false}));
  return {type,prompt:"what was the null in the "+labelTop(target.top)+" holding?",options:shuffle(opts).map(o=>({label:labelGadget(o.v),ok:o.ok}))};
}
function questionsFor(stop){return stop.id==="start"?1:2}
/* ---------- flow (step 6) ---------- */
function startRun(fresh){
  auInit();sfxMenu();
  S.mode="board";S.stop=0;S.lamps=3;S.results=[];S.sparks=0;S.correct=0;S.answered=0;
  S.lightsOut=false;S.seen={};S.secrets={};S.uncovered={};S.phaseT=0;S.settings=false;
  if(fresh)saveState();
}
function beginStop(){
  const stop=LINE[S.stop];
  S.mode="stop";S.stopPhase="approach";S.phaseT=0;S.scroll=0;
  S.seen={};S.uncovered={};S.qs=[];S.qi=0;S.q=null;
  buildFog();
}
function tickStop(dt,t){
  const stop=LINE[S.stop];
  if(S.stopPhase==="approach"){
    S.scroll+=stop.speed*dt*.3;S.phaseT+=dt;
    if(S.phaseT>2.6)nextPhase();
  } else if(S.stopPhase==="watch"){
    S.scroll+=stop.speed*dt*(cfg.assist?.7:1);
    S.phaseT+=dt;
    fogRegrow(dt,stop.fog);
    trackSeen(dt);
    if(S.phaseT>watchSeconds(stop))nextPhase();
  } else if(S.stopPhase==="reveal"){
    S.phaseT+=dt;
    if(S.phaseT>3)nextPhase();
  } else if(S.stopPhase==="depart"){
    S.scroll+=stop.speed*dt*1.7;S.phaseT+=dt;
    if(S.phaseT>2.4){
      S.stop++;
      if(S.lamps<=0&&!S.retryUsed){S.retryUsed=true;S.mode="retry";return}
      if(S.lamps<=0||S.stop>=LINE.length){S.mode="finale";saveState();return}
      beginStop();
    }
  }
}
function nextPhase(){
  S.phaseT=0;S.locked=false;
  if(S.stopPhase==="approach"){S.stopPhase="watch";return}
  if(S.stopPhase==="watch"){
    S.stopPhase="conductor";
    S.qs=[];for(let i=0;i<questionsFor(LINE[S.stop]);i++)S.qs.push(makeQuestion(LINE[S.stop]));
    S.qi=0;S.q=S.qs[0];S.typed="";S.typing=true;
    return;
  }
  if(S.stopPhase==="conductor"){
    S.qi++;
    if(S.qi<S.qs.length){S.q=S.qs[S.qi];S.typed="";S.typing=true;return}
    S.stopPhase="reveal";return;
  }
  S.stopPhase="depart";
}
function trackSeen(dt){
  for(const e of ENT){
    const cx=e.x, cy=e.y+e.h*.18;                 // face box
    const fx_=cx-58, fy_=cy-128-140;
    const sx=Math.max(0,Math.min(842,fx_-58)), sy=Math.max(0,Math.min(564,fy_));
    const a=fogAlphaAt(sx,sy);
    if(a<.42&&cx>60&&cx<900){
      S.seen[e.key]=(S.seen[e.key]||0)+dt;
      S.uncovered[e.key]=(S.uncovered[e.key]||0)+dt;
      if(S.seen[e.key]>0.4&&!S.secrets[e.key]&&!S._ticked?.[e.key]){  // step 5: look up
        (S._ticked||(S._ticked={}))[e.key]=1;sfxTick();S.sparkle={x:cx,y:cy,t:0};
      }
      if(S.uncovered[e.key]>1.2&&!S.secrets[e.key]&&pointer.down){     // hold-to-wave
        S.secrets[e.key]=true;S.sparks++;sfxSpark();S.sparkle={x:cx,y:cy-40,t:0};
      }
    } else {
      S.uncovered[e.key]=0;
    }
  }
}
function feedback(tier,t){
  // small: tick · medium: trauma .3 + flash · large: trauma .55 + hitstop .06 + flash
  if(tier==="small"){sfxTick();return}
  if(tier==="medium"){S.trauma=Math.min(1,S.trauma+0.30);S.flash=0.6;S.pop=1;return}
  if(tier==="large"){S.trauma=Math.min(1,S.trauma+0.55);S.flash=0.9;S.hitStop=0.06;S.pop=-1;return}
}
function answer(idx){
  if(S.locked)return;                     // puzzle skill: never apply input mid-resolution
  const q=S.q;if(!q)return;const o=q.options[idx];if(!o)return;
  S.locked=true;
  S.optSel=idx;
  const ok=!!o.ok;
  S.answered++;if(ok)S.correct++;
  S.results.push({stop:S.stop,prompt:q.prompt,picked:o.label,correct:ok});
  S.revealCorrect=ok;
  if(ok){sfxCorrect();feedback("medium");if(S.lamps<3&&S.correct%2===0)S.lamps=Math.min(3,S.lamps+1)}
  else{sfxWrong();feedback("large");S.lamps=Math.max(0,S.lamps-1);if(S.lamps<=0)S.lightsOut=true}
  S.ghost=ok?null:(q.options.find(x=>x.ok)?.tr||null);
  S.hitStop=ok?0:0.06;
  setTimeout(()=>nextPhase(),820);
}

function pop(){if(S.stack.length>1)S.stack.pop()}
function onDown(ev){
  ev.preventDefault();auInit();const p=stageXY(ev);
  pointer.down=true;pointer.x=p.x;pointer.y=p.y;pointer.hold=0;
  if(top()==="options"){
    if(p.y>240&&p.y<240+8*86){
      const i=Math.floor((p.y-240)/86);S.setSel=i;
      if(i===0&&AU.master)AU.master.gain.value=AU.master.gain.value>0?0:0.5;
      if(i===1&&AU.music)AU.music.gain.value=AU.music.gain.value>0?0:0.14;
      if(i===2&&AU.sfx)AU.sfx.gain.value=AU.sfx.gain.value>0?0:0.45;
      if(i===4)cfg.reduced=!cfg.reduced;
      if(i===5)cfg.assist=!cfg.assist;
      if(i===6)cfg.reduceShake=!cfg.reduceShake;
      if(i===7)cfg.reduceFlash=!cfg.reduceFlash;
    } else if(p.y>H-220){pop()}
    return;
  }
  if(top()==="howto"){pop();return}
  if(S.mode==="title"){
    if(p.y>500&&p.y<620){startRun(true);return}
    if(p.y>=620&&p.y<690){push("howto");return}
    if(p.y>=690){push("options");return}
    startRun(true);return;
  }
  if(S.mode==="stop"&&S.stopPhase==="conductor"&&S.q){
    for(let i=0;i<4;i++){const y=panelText().top+118+i*46;if(p.y>y-34&&p.y<y+14){answer(i);return}}
  }
  if(S.mode==="retry"){
    if(p.y<650){S.lamps=3;S.lightsOut=false;S.correct=Math.max(0,S.correct-0);beginStop();S.mode="stop";}
    else {S.mode="finale"}
    return;
  }
  if(S.mode==="finale"){S.mode="card";sfxCorrect();return}
  if(S.mode==="card"){downloadCard();return}
}
function onMove(ev){
  if(!pointer.down)return;ev.preventDefault();
  const p=stageXY(ev);
  if(S.mode==="stop"&&S.stopPhase==="watch"){
    wipeAt(p.x-58,p.y-128,p.x-pointer.x,p.y-pointer.y);
    if(Math.random()<.3)sfxWipe(Math.min(1,Math.hypot(p.x-pointer.x,p.y-pointer.y)/40));
  }
  pointer.x=p.x;pointer.y=p.y;
}
function onUp(){pointer.down=false}
function sfxWipe(v){if(!AU.on)return;blip(220+v*900,.03,"sine",.05)}

glc.addEventListener("pointerdown",onDown);
glc.addEventListener("pointermove",onMove);
addEventListener("pointerup",onUp);
addEventListener("keydown",e=>{
  if(e.key==="m"){if(AU.master)AU.master.gain.value=AU.master.gain.value>0?0:.5;return}
  if(S.mode==="stop"&&S.stopPhase==="conductor"){const n=parseInt(e.key);if(n>=1&&n<=4)answer(n-1)}
  if(e.key===" "){auInit();if(S.mode==="title")startRun(true)}
});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(!document.hidden){
    // game-feel §1: trauma^2, summed sines (not per-frame random), decay in real time
    S.trauma=Math.max(0,S.trauma-1.6*dt);
    S.flash=Math.max(0,S.flash-dt*3);
    S.hitStop=Math.max(0,S.hitStop-dt);
    const frozen=S.hitStop>0;
    if(S.sparkle){S.sparkle.t+=dt;if(S.sparkle.t>.8)S.sparkle=null}
    if(S.pop){S.pop=Math.sign(S.pop)*Math.max(0,Math.abs(S.pop)-dt*4)}
    ctx.save();
    if(S.trauma>0&&!cfg.reduced&&!cfg.reduceShake){
      const sh=S.trauma*S.trauma, tx=t*17, ty=t*23, tr=t*11;
      ctx.translate(12*sh*Math.sin(tx),8*sh*Math.sin(ty));
      ctx.rotate(0.012*sh*Math.sin(tr));
    }
    ctx.fillStyle=C.night;ctx.fillRect(-20,-20,W+40,H+40);
    if(S.mode==="title")drawTitle(t);
    else if(top()==="howto"){drawHowTo()}
    else if(top()==="options")drawSettings();
    else if(S.mode==="board"){
      drawScene(t,20,LINE[0]);drawCabin(t,3);
      ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,W,H);
      ctx.textAlign="center";ctx.fillStyle="#e8d6b0";ctx.font="700 34px ui-monospace,Menlo,monospace";
      ctx.fillText("all aboard",W/2,600);ctx.textAlign="left";
      if((S.phaseT+=dt)>2.6)beginStop();
    }
    else if(S.mode==="stop"){
      tickStop(frozen?0:dt,t);
      if(S.mode==="stop"){
        const stop=LINE[S.stop];
        drawScene(t,S.scroll,stop);
        ctx.save();ctx.beginPath();rr(ctx,58,128,844,566,36);ctx.clip();
        ctx.drawImage(fog,58,128);ctx.restore();
        drawCabin(t,S.lamps);
        drawHud(stop);
        // conductor
        const cx=(S.stopPhase==="conductor"||S.stopPhase==="reveal")?Math.min(0,-280+S.phaseT*900):-320;
        drawConductor(cx,t);
        // ghost: only the correct null (step 6)
        if(S.ghost){
          const e=ENT.find(x=>x.traits===S.ghost);
          if(e){ctx.strokeStyle="rgba(245,184,114,.95)";ctx.lineWidth=4;ctx.setLineDash([10,8]);
            rr(ctx,e.x-e.w/2,e.y,e.w,e.h,18);ctx.stroke();ctx.setLineDash([])}
        }
        if(S.stopPhase==="conductor"&&S.q){
          if(S.typing){
            S.typed=S.q.prompt.slice(0,Math.floor(S.phaseT*40));
            if(S.typed.length>=S.q.prompt.length)S.typing=false;
            if(Math.random()<.5)blip(420+Math.random()*260,.02,"square",.05);
          }
          const p=panelText();
          ctx.fillStyle="#e8d6b0";ctx.font="700 30px ui-monospace,Menlo,monospace";
          wrap(S.typed+" ▍",p.x,p.y,p.w,40);
          drawOptions(S.q.options,S.optSel);
        }
        if(S.stopPhase==="reveal"){
          const p=panelText();
          ctx.fillStyle=S.revealCorrect?"#9fe8b8":"#ffb0b0";
          ctx.font="700 30px ui-monospace,Menlo,monospace";
          wrap(S.revealCorrect?"correct. the lights stay warm.":"not quite. watch the outline of the right one.",p.x,p.y,p.w,40);
        }
        if(S.sparkle){
          const sp=S.sparkle;ctx.save();ctx.globalAlpha=Math.max(0,1-sp.t/.8);
          for(let i=0;i<7;i++){const a=i/7*6.283+sp.t*4,r=10+sp.t*40;
            ctx.fillStyle="#ffd9a0";ell(ctx,sp.x+Math.cos(a)*r,sp.y+Math.sin(a)*r,3,3)}
          ctx.restore();
        }
      }
    }
    else if(S.mode==="retry"){drawRetry()}
    else if(S.mode==="finale"){
      drawScene(t,0,LINE[6]);drawCabin(t,S.lamps);
      ctx.fillStyle="rgba(0,0,0,.62)";ctx.fillRect(0,0,W,H);
      ctx.textAlign="center";ctx.fillStyle="#e8d6b0";ctx.font="700 30px ui-monospace,Menlo,monospace";
      ctx.fillText(S.lightsOut?"please do not turn off the power":"do you remember where you left off?",W/2,560);
      ctx.font="700 24px ui-monospace,Menlo,monospace";ctx.fillStyle="rgba(232,214,176,.75)";
      ctx.fillText("tap for your memory card",W/2,626);ctx.textAlign="left";
    }
    else if(S.mode==="card"){
      const c=drawCard(),s=Math.min((W-80)/c.width,(H-170)/c.height);
      ctx.fillStyle="#05040a";ctx.fillRect(0,0,W,H);
      ctx.drawImage(c,(W-c.width*s)/2,60,c.width*s,c.height*s);
      ctx.textAlign="center";ctx.fillStyle="#9fe8b8";ctx.font="700 24px ui-monospace,Menlo,monospace";
      ctx.fillText("memory card unlocked · tap to save",W/2,H-56);ctx.textAlign="left";
    }
    if(S.flash>0&&!cfg.reduceFlash){ctx.fillStyle="rgba(245,184,114,"+(S.flash*.12)+")";ctx.fillRect(0,0,W,H)}
    ctx.restore();
    if(DEBUG!=="shots"&&DEBUG!=="gallery")present(t,S.lamps/3);
  }
  requestAnimationFrame(frame);
}
function drawRetry(){
  ctx.fillStyle="rgba(6,5,12,.94)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#e8d6b0";ctx.font="700 34px ui-monospace,Menlo,monospace";ctx.textAlign="center";
  ctx.fillText("five more minutes?",W/2,470);
  ctx.font="700 26px ui-monospace,Menlo,monospace";ctx.fillStyle="rgba(232,214,176,.8)";
  ctx.fillText("replay stop "+(S.stop+1)+" with all three lamps",W/2,530);
  ctx.fillStyle="#9fe8b8";ctx.font="700 28px ui-monospace,Menlo,monospace";
  ctx.fillText("> yes, once more",W/2,620);
  ctx.fillStyle="rgba(232,214,176,.65)";ctx.font="700 24px ui-monospace,Menlo,monospace";
  ctx.fillText("  no, take the card",W/2,676);
  ctx.textAlign="left";
}
function drawHowTo(){
  ctx.fillStyle="#0b0714";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#e8d6b0";ctx.font="700 42px ui-monospace,Menlo,monospace";ctx.fillText("how to play",80,180);
  ctx.font="700 28px ui-monospace,Menlo,monospace";ctx.fillStyle="rgba(232,214,176,.9)";
  const lines=["the glass is fogged. drag your thumb to wipe it.",
    "watch the platform slide by. remember who holds what.",
    "the conductor asks. right answers keep the lamps warm.",
    "three lamps. lose them all and the run ends early."];
  lines.forEach((l,i)=>wrap(l,80,280+i*86,W-160,40));
  ctx.fillStyle="rgba(232,214,176,.6)";ctx.font="700 24px ui-monospace,Menlo,monospace";
  ctx.fillText("tap to go back",80,H-140);
}

/* ---------- debug: shots (3 stops contact sheet) & gallery ---------- */
function contactSheet(){
  const ids=[0,3,6];
  ctx.fillStyle="#05040a";ctx.fillRect(0,0,W,H);
  const pw=(W-60)/3, ph=H-140;
  ids.forEach((si,i)=>{
    const x0=20+i*(pw+10), y0=60;
    ctx.save();ctx.beginPath();ctx.rect(x0,y0,pw,ph);ctx.clip();
    ctx.translate(x0,y0);ctx.scale(pw/W,ph/580);ctx.translate(0,-180);
    const stop=LINE[si];
    const saved={stop:S.stop,seen:S.seen};
    S.stop=si;S.seen={};
    for(const it of stripOf(stop).items)for(let k=0;k<it.frame.nulls.length;k++)S.seen[stop.id+":"+it.frame.id+":"+k]=3;
    const items=stripOf(stop).items;
    const mid=items[Math.floor(items.length/2)];
    drawScene(2.2,Math.max(0,mid.x-260),stop);
    S.stop=saved.stop;S.seen=saved.seen;
    ctx.restore();
    ctx.strokeStyle="rgba(245,184,114,.4)";ctx.lineWidth=2;ctx.strokeRect(x0,y0,pw,ph);
    ctx.fillStyle="#e8d6b0";ctx.font="700 24px ui-monospace,Menlo,monospace";
    ctx.fillText("stop "+(si+1)+" · "+stop.title,x0+10,y0+ph+34);
  });
  ctx.fillStyle="rgba(232,214,176,.5)";ctx.font="700 20px ui-monospace,Menlo,monospace";
  ctx.fillText("contact sheet · stops 1 / 4 / 7",20,40);
}
function gallery(){
  ctx.fillStyle="#0b0714";ctx.fillRect(0,0,W,H);
  const cats=Object.keys(P);
  let y=90;
  cats.forEach((cat,ci)=>{
    ctx.fillStyle="#e8d6b0";ctx.font="700 22px ui-monospace,Menlo,monospace";
    ctx.fillText(cat,24,y);
    P[cat].forEach((v,i)=>{
      const x=180+i*130;
      const tr=N({});tr[cat]=v;
      drawNull(ctx,tr,x,y+60,0.42,2.0,{ph:i});
      ctx.fillStyle="rgba(232,214,176,.7)";ctx.font="700 16px ui-monospace,Menlo,monospace";
      ctx.fillText(v,x-34,y+130);
    });
    y+=190;
  });
}

/* ---------- boot ---------- */
resize();
cfg.shell=true;
initGL();
S.resume=loadState();
if(DEBUG==="gallery"){gallery();setInterval(()=>present(0,1),300);}
else if(DEBUG==="shots"){contactSheet();setInterval(()=>present(0,1),300);}
else requestAnimationFrame(frame);
window.__ws={get S(){return S},get cfg(){return cfg},get ENT(){return ENT},
  frame,drawCard,drawScene,present,contactSheet,gallery,stripOf,watchSeconds,
  startRun,beginStop,answer,makeQuestion,fogAlphaAt,tier,cardCode,LINE};

</script>
